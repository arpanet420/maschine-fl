name: CI

# The checks that need no hardware and no FL Studio (`npm run check`).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The native modules' headers (usb, node-hid).
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - run: npm ci
      - run: npm run check
